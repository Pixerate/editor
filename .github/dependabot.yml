version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      # Groups match in order, so TipTap updates (majors included, #921) always
      # land in one PR: mixing @tiptap/* versions installs two ProseMirror copies.
      # See GOTCHAS.md: "TipTap Must Be a Peer Dependency".
      tiptap:
        patterns:
          - "@tiptap/*"
          - "tiptap-markdown"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
