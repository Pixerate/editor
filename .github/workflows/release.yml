name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Release & Publish (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository_owner == 'Pixerate' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT || secrets.GH_TOKEN_FOR_PACKAGES || secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for pending changesets
        id: changeset_check
        run: |
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)
          echo "count=$CHANGESETS" >> $GITHUB_OUTPUT
          if [ "$CHANGESETS" -gt "0" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Release required. Pending changesets: $CHANGESETS"
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "No pending changesets found. Skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure Git
        if: steps.changeset_check.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Version packages & update CHANGELOG.md files
        if: steps.changeset_check.outputs.should_release == 'true'
        run: pnpm version-packages

      - name: Build packages
        if: steps.changeset_check.outputs.should_release == 'true'
        run: pnpm build

      - name: Run unit tests
        if: steps.changeset_check.outputs.should_release == 'true'
        run: pnpm test

      - name: Check the packed packages (types for every subpath, Node import and require)
        if: steps.changeset_check.outputs.should_release == 'true'
        run: pnpm check:packages

      - name: Refuse versions that are already on npm
        if: steps.changeset_check.outputs.should_release == 'true'
        run: |
          # A version main has not recorded but npm already has means an earlier release
          # published without pushing its version commit. Publishing would fail part-way.
          for dir in packages/core packages/react packages/svelte; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            before=$(git show "HEAD:$dir/package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            if [ "$version" != "$before" ] && npm view "$name@$version" version > /dev/null 2>&1; then
              echo "::error::$name@$version is already on npm but main is still at $before. Commit that release's version bump to main (see GOTCHAS.md, 'A Release That Fails Part-Way')."
              exit 1
            fi
          done

      - name: Commit version bumps & changelogs and push them to main
        if: steps.changeset_check.outputs.should_release == 'true'
        run: |
          git add .
          git commit -m "chore(release): version packages and update changelogs [skip ci]" || echo "No changes to commit"
          # Push before publishing, so main always records what npm has. Another merge may have
          # landed meanwhile: rebase onto it (its changesets stay pending for the next release).
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2> /dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the version commit to main; nothing was published."
          exit 1

      - name: Publish changed packages to npm (OIDC)
        if: steps.changeset_check.outputs.should_release == 'true'
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Push release tags
        if: steps.changeset_check.outputs.should_release == 'true'
        run: git push origin --tags
