name: Preview Screenshots

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/swift/**/*.swift'
      - 'apps/swift-demo/**/*.swift'
      - 'Package.swift'
      - '.github/workflows/preview-screenshots.yml'

permissions:
  contents: write

concurrency:
  group: preview-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render-previews:
    name: Render Preview Screenshots
    runs-on: macos-26
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # A push made with GITHUB_TOKEN starts no workflows, which would leave the PR's new head
          # commit with no checks. Push with the same PAT release.yml uses so CI runs on it.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Render macOS preview screenshots
        run: |
          mkdir -p docs/previews
          EDITOR_PREVIEW_EXPORT_DIR="$PWD/docs/previews" \
          swift test --package-path apps/swift-demo --filter PreviewSnapshotTests

      - name: Commit updated preview screenshots
        run: |
          if [ -z "$(git status --porcelain docs/previews)" ]; then
            echo "No preview screenshot changes."
            exit 0
          fi
          # This run's own screenshot commit re-triggers it; if the renders still differ (they are
          # not byte-stable), stop rather than commit in a loop.
          if [ "$(git log -1 --format=%s)" = "chore: update preview screenshots" ]; then
            echo "::warning::Preview screenshots changed again right after a screenshot commit; not committing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/previews
          git commit -m "chore: update preview screenshots"
          git push origin HEAD:${{ github.head_ref }}
